#Server config settings
[server]

	#Iron Cloud Boots Settings
	[server.ironCloudBoots]
		# Default: 1
		# Range: 0 ~ 10
		jumpBoostLevel = 1
		# Default: 0.05
		# Range: 0.0 ~ 5.0
		speedModifier = 0.05
		# Default: 0.01
		# Range: 0.0 ~ 5.0
		flyingSpeedModifier = 0.01
		negatesFallDamage = true

